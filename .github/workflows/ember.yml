name: Ember.js CI

env:
  NODE_VERSION: 22.x

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v2.0.1
      with:
        version: latest

    - name: Install Dependencies
      run: pnpm install

    - name: Build
      run: pnpm run build

  npm_publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v2

    - name: Setup Node.js 18.x
      uses: actions/setup-node@v2
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Setup pnpm
      uses: pnpm/action-setup@v2.0.1
      with:
        version: latest

    - name: Install Dependencies
      run: pnpm install

    - name: Build
      run: pnpm run build

    - name: Set up npm
      run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" > ~/.npmrc

    - name: Publish
      run: npm publish --access public

  github_publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v2.0.1
        with:
          version: latest

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Configure npm for GitHub registry
        run: |
          echo "@fleetbase:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Publish to GitHub registry
        run: npm publish

  fleetbase_publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v2.0.1
        with:
          version: latest

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Install Fleetbase CLI
        run: npm i -g @fleetbase/cli npm-cli-login

      - name: Login to Fleetbase Registry
        run: npm-cli-login -u ${{ secrets.FLEETBASE_REGISTRY_USERNAME }} -p ${{ secrets.FLEETBASE_REGISTRY_PASSWORD }} -e ${{ secrets.FLEETBASE_REGISTRY_EMAIL }} -r https://registry.fleetbase.io

      - name: Publish to Fleetbase registry
        run: flb publish

  fleetbase_publish_qa:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v2.0.1
        with:
          version: latest

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Install Fleetbase CLI
        run: npm i -g @fleetbase/cli npm-cli-login

      - name: Login to Fleetbase Registry
        run: npm-cli-login -u ${{ secrets.FLEETBASE_QA_REGISTRY_USERNAME }} -p ${{ secrets.FLEETBASE_QA_REGISTRY_PASSWORD }} -e ${{ secrets.FLEETBASE_QA_REGISTRY_EMAIL }} -r https://registry.qa.fleetbase.io

      - name: Publish to Fleetbase registry
        run: flb publish --registry https://registry.qa.fleetbase.io
